<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Objects</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #2b2d42;
    --muted: #6b6f85;
    --line: #e4dcc6;
    --accent: #3a86ff;
    --good: #2fbf71;
    --good-bg: #d9f7e6;
    --bad: #e5484d;
    --bad-bg: #fde3e4;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  /* Everything is sized in rem. The root scales with the screen so the page looks the same
     on a 1366x768 board, a 1080p board or a 4K board (16px at 1920x1080). */
  html { font-size: clamp(10px, min(0.8333vw, 1.4815vh), 48px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  header {
    flex-wrap: wrap;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.875rem 1.75rem;
  }
  h1 { margin: 0; font-size: clamp(1.375rem, 3vw, 2.375rem); }
  .tabs { display: flex; gap: 0.625rem; }
  .tab {
    font: inherit;
    font-size: clamp(1rem, 1.8vw, 1.5rem);
    padding: 0.5rem 1.25rem;
    border-radius: 62.4375rem;
    border: 0.1875rem solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .2s var(--ease-spring), background .25s, border-color .25s;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:disabled { opacity: .45; cursor: default; }
  .score { font-size: clamp(1.125rem, 2.2vw, 1.875rem); font-weight: bold; white-space: nowrap; display: inline-block; }
  .score.bump { animation: bump .5s var(--ease-spring); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(-4deg); } 100% { transform: scale(1); } }

  .progress { height: 0.875rem; margin: 0 1.75rem; background: var(--line); border-radius: 6.1875rem; overflow: hidden; }
  .progress > div {
    height: 100%;
    width: 100%;
    transform: scaleX(0);
    transform-origin: left;
    background: linear-gradient(90deg, #3a86ff, #59c9a5);
    border-radius: 6.1875rem;
    transition: transform .6s var(--ease-out);
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.75rem;
    padding: 1.25rem 1.75rem 1.75rem;
    align-items: stretch;
  }
  .picture {
    position: relative;
    background: var(--card);
    border: 0.25rem solid var(--line);
    border-radius: 1.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    min-height: 0;
    transition: border-color .3s, background .3s;
  }
  .picture.solved { border-color: var(--good); background: #f4fdf8; }
  .picture svg {
    width: 100%;
    height: 100%;
    max-height: 62vh;
    animation: float 3.6s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.5rem); } }
  .picture.solved svg { animation: hop .7s var(--ease-spring); }
  @keyframes hop { 0% { transform: scale(1); } 35% { transform: scale(1.12) rotate(-3deg); } 70% { transform: scale(.97) rotate(2deg); } 100% { transform: scale(1); } }

  /* question change: old content leaves, new content arrives */
  .picture, .quiz > * { will-change: transform, opacity; }
  .leaving { animation: leave .22s ease-in forwards; }
  .entering { animation: enter .5s var(--ease-out) both; }
  @keyframes leave { to { opacity: 0; transform: translateX(-1.875rem) scale(.97); } }
  @keyframes enter { from { opacity: 0; transform: translateX(2.5rem) scale(.97); } to { opacity: 1; transform: none; } }

  .quiz { display: flex; flex-direction: column; justify-content: center; gap: 1.25rem; min-height: 0; }
  .question { font-size: clamp(2.125rem, 5.5vw, 5rem); font-weight: bold; margin: 0 0 0.375rem; }
  .question .q-emoji { display: inline-block; animation: wiggle 2.8s ease-in-out infinite; transform-origin: 70% 80%; }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(14deg); } 90% { transform: rotate(-10deg); } 95% { transform: rotate(8deg); } }
  .options { display: flex; flex-direction: column; gap: 1.125rem; }
  .option {
    font: inherit;
    font-size: clamp(1.625rem, 4vw, 3.5rem);
    display: flex;
    align-items: center;
    gap: 1.375rem;
    text-align: left;
    padding: 1rem 1.625rem;
    border-radius: 1.5rem;
    border: 0.25rem solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    position: relative;
    transition: transform .25s var(--ease-spring), background .3s, border-color .3s, opacity .3s, box-shadow .3s;
    animation: pop .5s var(--ease-spring) backwards;
    animation-delay: calc(var(--i) * 90ms + 120ms);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(1.5rem) scale(.94); } to { opacity: 1; transform: none; } }
  @media (hover: hover) { .option:hover { transform: translateX(0.5rem); box-shadow: 0 0.375rem 0 var(--line); } }
  .option:active { transform: scale(.97); }
  .option .letter {
    flex: none;
    width: 1.5em; height: 1.5em;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bg);
    border: 0.1875rem solid var(--line);
    font-weight: bold;
    transition: background .3s, border-color .3s, color .3s;
  }
  .option .label { flex: 1; }
  .option .mark { font-size: .9em; opacity: 0; transform: scale(0) rotate(-40deg); transition: transform .45s var(--ease-spring), opacity .2s; }
  .option.correct { background: var(--good-bg); border-color: var(--good); animation: none; transform: scale(1.03); }
  .option.correct .letter { background: var(--good); border-color: var(--good); color: #fff; }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .4s ease; }
  .option.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.correct .mark, .option.wrong .mark { opacity: 1; transform: none; }
  .options.locked .option:not(.correct):not(.wrong) { opacity: .5; transform: scale(.98); }
  .options.locked .option { cursor: default; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-0.75rem); } 40% { transform: translateX(0.625rem); }
    60% { transform: translateX(-0.4375rem); } 80% { transform: translateX(0.25rem); }
  }

  .feedback {
    min-height: 1.3em;
    font-size: clamp(1.5rem, 3.2vw, 2.75rem);
    font-weight: bold;
    margin: 0;
  }
  .feedback.show { animation: pop .5s var(--ease-spring) both; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .next {
    align-self: flex-start;
    font: inherit;
    font-size: clamp(1.375rem, 3vw, 2.5rem);
    padding: 0.75rem 2.25rem;
    border-radius: 62.4375rem;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transform: translateY(1rem) scale(.9);
    pointer-events: none;
    transition: opacity .3s, transform .45s var(--ease-spring);
  }
  .next.show { opacity: 1; transform: none; pointer-events: auto; }
  .next.show:active { transform: scale(.94); }

  .done { grid-column: 1 / -1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.375rem; text-align: center; }
  .done h2 { font-size: clamp(2.25rem, 6vw, 5.25rem); margin: 0; }
  .done p { font-size: clamp(1.5rem, 3.5vw, 3rem); margin: 0; }
  .done .stars { font-size: clamp(3.5rem, 10vw, 9.375rem); font-weight: bold; animation: pop .7s var(--ease-spring) .3s backwards; }
  .done .stars span { display: inline-block; animation: pop .7s var(--ease-spring) both; animation-delay: calc(var(--i) * 180ms + 200ms); }
  .done .next { opacity: 1; transform: none; pointer-events: auto; align-self: center; }
  body.mode12 #nextActivity { display: none; }   /* nothing after Activity 1.2 yet */
  body.finished main > :not(.done) { display: none; }
  body.finished .done { display: flex; animation: enter .6s var(--ease-out) both; }

  /* ---------- picture wrapper + drag and drop (Activity 1) ---------- */
  .art { width: 100%; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  body.mode1 .art { cursor: grab; touch-action: none; }
  .picture.dragging .art svg { animation: none; opacity: .22; }
  .picture.dragging .art { cursor: grabbing; }
  .ghost {
    position: fixed; left: 0; top: 0; z-index: 30;
    pointer-events: none;
    filter: drop-shadow(0 0.875rem 0.875rem rgba(0,0,0,.28));
    will-change: transform;
  }
  .ghost svg { width: 100%; height: 100%; display: block; }
  .option.zone { border-style: dashed; background: #fffdf7; }
  .option.zone.over { border-color: var(--accent); border-style: solid; background: #eaf2ff; transform: scale(1.04); }
  .option.zone.correct { border-style: solid; }
  @media (hover: hover) { .option.zone:hover { transform: none; box-shadow: none; } .option.zone.over:hover { transform: scale(1.04); } }
  .feedback.hint { color: var(--muted); }

  /* ---------- the pencil mascot ---------- */
  .mascot { position: absolute; right: 0.875rem; bottom: 0.625rem; width: clamp(7rem, 9vw, 10rem); pointer-events: none; z-index: 2; }
  .mascot svg { width: 100%; display: block; overflow: visible; }
  .mascot.big { position: relative; right: auto; bottom: auto; width: clamp(6.875rem, 16vw, 11.875rem); margin: 0 auto; }
  body:not(.finished) .mascot.big { display: none; }
  .m-body { transform-origin: 60px 186px; animation: mbob 3s ease-in-out infinite; }
  @keyframes mbob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
  .m-eyes { transform-origin: 60px 82px; animation: mblink 4.2s infinite; }
  @keyframes mblink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .m-arm { transition: transform .35s var(--ease-spring); }
  .m-arm.l { transform-origin: 26px 108px; }
  .m-arm.r { transform-origin: 94px 108px; }
  .mascot [class*="show-"] { display: none; }
  .mascot[data-mood="idle"] .show-idle, .mascot[data-mood="idle"] .show-open,
  .mascot[data-mood="happy"] .show-happy,
  .mascot[data-mood="sad"] .show-sad, .mascot[data-mood="sad"] .show-open { display: inline; }
  .mascot[data-mood="happy"] .m-body { animation: mjump .6s var(--ease-spring) 3; }
  .mascot[data-mood="happy"] .m-arm.l { transform: rotate(125deg); }
  .mascot[data-mood="happy"] .m-arm.r { transform: rotate(-125deg); }
  .mascot[data-mood="sad"] .m-body { animation: mshake .5s ease 1, mdroop 0s .5s forwards; }
  .mascot.big[data-mood="happy"] .m-body { animation-iteration-count: infinite; }
  @keyframes mjump {
    0% { transform: translateY(0) scale(1.06, .92); }
    45% { transform: translateY(-26px) scale(.96, 1.06) rotate(-4deg); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes mshake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes mdroop { to { transform: rotate(-3deg) translateY(2px); } }
  .bubble {
    position: absolute; right: 78%; bottom: 76%;
    min-width: 5.625rem; max-width: 13.75rem;
    padding: 0.5rem 0.875rem;
    background: #fff; border: 0.1875rem solid var(--ink); border-radius: 1.125rem;
    font-size: 1.25rem; font-weight: bold; text-align: center; line-height: 1.2;
    opacity: 0; transform: scale(.4); transform-origin: 100% 100%;
    transition: opacity .2s, transform .45s var(--ease-spring);
    white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; right: 0.875rem; bottom: -0.6875rem; width: 1rem; height: 1rem;
    background: #fff; border-right: 0.1875rem solid var(--ink); border-bottom: 0.1875rem solid var(--ink);
    transform: rotate(45deg);
  }
  .bubble.show { opacity: 1; transform: scale(1); }
  .mascot.big .bubble { right: 90%; bottom: 60%; font-size: 1.625rem; }

  .flystar {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 11;
    font-size: clamp(2.5rem, 5vw, 4.75rem);
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0.25rem 0.375rem rgba(0,0,0,.25));
  }

  .confetti {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 10;
    font-size: clamp(1.5rem, 3vw, 2.75rem);
    will-change: transform, opacity;
  }

  @media (max-width: 800px) {
    html { font-size: 16px; }
    html, body { height: auto; min-height: 100%; }
    body { overflow-x: hidden; overflow-y: auto; }

    header { padding: 0.5rem 0.875rem; gap: 0.375rem 0.625rem; }
    h1 { order: 1; flex: 1 1 0; min-width: 0; font-size: 1.125rem; line-height: 1.1; }
    #sound { order: 2; padding: 0.25rem 0.75rem; font-size: 1.125rem; }
    .score { order: 3; font-size: 1.25rem; }
    .tabs { order: 4; flex: 1 1 100%; gap: 0.5rem; }
    .tab { font-size: 0.8125rem; padding: 0.4375rem 0.625rem; border-width: 0.125rem; }
    .tabs .tab { flex: 1 1 0; border-radius: 1rem; line-height: 1.2; text-wrap: balance; }
    .progress { margin: 0 0.875rem 0.375rem; height: 0.625rem; }

    main {
      display: flex;
      flex-direction: column;
      flex: none;
      min-height: calc(100vh - 8.125rem);
      gap: 0.875rem;
      padding: 0.5rem 0.875rem 1.75rem;
    }
    .picture { flex: none; height: 32vh; min-height: 11.875rem; max-height: 18.75rem; padding: 0.75rem; border-width: 0.1875rem; border-radius: 1.375rem; }
    .picture svg { height: 100%; max-height: 100%; }
    .quiz { flex: none; justify-content: flex-start; gap: 0.75rem; }
    .question { font-size: 1.75rem; margin: 0; line-height: 1.2; }
    .options { gap: 0.625rem; }
    .option { font-size: 1.3125rem; padding: 0.75rem 0.875rem; gap: 0.75rem; border-width: 0.1875rem; border-radius: 1.125rem; }
    .option .letter { border-width: 0.125rem; }
    .feedback { font-size: 1.3125rem; min-height: 1.3em; }
    .next { align-self: stretch; text-align: center; font-size: 1.25rem; padding: 0.75rem 1.25rem; }

    .done { flex: 1; gap: 0.875rem; }
    .done h2 { font-size: 2.5rem; }
    .done .stars { font-size: 4rem; }
    .confetti { font-size: 1.625rem; }
    .flystar { font-size: 2.5rem; }
    .tab .w { display: none; }
    .tabs .tab { padding: 0.4375rem 0.375rem; font-size: 0.8125rem; }
    body.mode1 .picture { height: 26vh; min-height: 9.375rem; }
    .mascot { width: 3.625rem; right: 0.5rem; bottom: 0.375rem; }
    .bubble { font-size: 0.8125rem; padding: 0.25rem 0.5625rem; border-width: 0.125rem; min-width: 0; max-width: 9.375rem; border-radius: 0.75rem; }
    .bubble::after { width: 0.625rem; height: 0.625rem; bottom: -0.4375rem; border-width: 0.125rem; }
    .mascot.big { width: 6.875rem; }
    .mascot.big .bubble { font-size: 1.125rem; right: 40%; bottom: 100%; }
  }
</style>
</head>
<body>
<div class="top">
<header>
  <h1>🏫 Classroom Objects</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab1" aria-selected="true">🔍 <span class="w">Activity </span>1 · What is it?</button>
    <button class="tab" role="tab" id="tab12" aria-selected="false">🤔 <span class="w">Activity </span>1.2 · Is it …?</button>
  </div>
  <button class="tab" id="sound" title="Sound on/off" aria-label="Sound">🔊</button>
  <div class="score" id="score">⭐ 0 / 8</div>
</header>
<div class="progress"><div id="bar"></div></div>
</div>

<main>
  <div class="picture" id="picture" aria-live="polite">
    <div class="art" id="art"></div>
    <div class="mascot" id="mascotA"></div>
  </div>
  <section class="quiz">
    <p class="question" id="question">What is it? <span class="q-emoji">🤔</span></p>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="next" id="next">Next ➜</button>
  </section>
  <section class="done">
    <div class="mascot big" id="mascotB"></div>
    <h2>Well done!</h2>
    <div class="stars" id="stars"></div>
    <button class="next" id="nextActivity">Next activity ➜</button>
  </section>
</main>

<script>
(function () {
  // Simple hand-drawn pictures, so the page works offline on the smartboard.
  var W = 'stroke="#2b2d42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';

  // One pencil sticking out of the pencil case, drawn pointing up.
  function casePencil(x, angle, body, tip) {
    return '<g transform="rotate(' + angle + ' ' + x + ' 80)">' +
      '<rect x="' + (x - 7) + '" y="14" width="14" height="66" fill="' + body + '" ' + W + '/>' +
      '<polygon points="' + (x - 7) + ',14 ' + (x + 7) + ',14 ' + x + ',0" fill="#f6d8a8" ' + W + '/>' +
      '<polygon points="' + (x - 2.6) + ',5 ' + (x + 2.6) + ',5 ' + x + ',0" fill="#2b2d42"/>' +
      '</g>';
  }

  var ITEMS = [
    { name: 'desk', article: 'a', svg:
      '<rect x="22" y="58" width="156" height="16" rx="3" fill="#c98a4b" ' + W + '/>' +
      '<rect x="34" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="158" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="42" y="96" width="116" height="10" fill="#a9703a" ' + W + '/>' },
    { name: 'chair', article: 'a', svg:
      '<rect x="62" y="16" width="76" height="62" rx="6" fill="#d9a066" ' + W + '/>' +
      '<line x1="82" y1="22" x2="82" y2="74" ' + W + '/><line x1="100" y1="22" x2="100" y2="74" ' + W + '/><line x1="118" y1="22" x2="118" y2="74" ' + W + '/>' +
      '<rect x="48" y="84" width="104" height="16" rx="4" fill="#c98a4b" ' + W + '/>' +
      '<line x1="58" y1="100" x2="52" y2="148" ' + W + '/><line x1="142" y1="100" x2="148" y2="148" ' + W + '/>' +
      '<line x1="72" y1="100" x2="76" y2="140" ' + W + '/><line x1="128" y1="100" x2="124" y2="140" ' + W + '/>' },
    { name: 'pencil', article: 'a', svg:
      '<g transform="rotate(-35 100 80)">' +
      '<rect x="24" y="66" width="22" height="28" rx="4" fill="#f4a6b8" ' + W + '/>' +
      '<rect x="44" y="66" width="8" height="28" fill="#b9bcc7" ' + W + '/>' +
      '<rect x="50" y="66" width="98" height="28" fill="#ffb627" ' + W + '/>' +
      '<polygon points="148,66 182,80 148,94" fill="#f6d8a8" ' + W + '/>' +
      '<polygon points="170,75 182,80 170,85" fill="#2b2d42" ' + W + '/>' +
      '</g>' },
    { name: 'pencil case', article: 'a', svg:
      // pencils peek out from behind the case
      casePencil(58, -10, '#e5484d') +
      casePencil(86, -2, '#3a86ff') +
      casePencil(114, 5, '#59c9a5') +
      casePencil(142, 13, '#ffb627') +
      // case body
      '<rect x="18" y="72" width="164" height="72" rx="24" fill="#3ac2a0" ' + W + '/>' +
      // zipper strip along the top, with teeth and a pull tab
      '<rect x="30" y="82" width="140" height="12" rx="6" fill="#2a9d82" ' + W + '/>' +
      '<line x1="36" y1="88" x2="156" y2="88" stroke="#f4f1de" stroke-width="7" stroke-dasharray="3 5" stroke-linecap="butt"/>' +
      '<rect x="150" y="80" width="18" height="16" rx="5" fill="#ffd166" ' + W + '/>' +
      '<circle cx="168" cy="88" r="6" fill="none" ' + W + '/>' +
      // front pocket with a star
      '<rect x="34" y="104" width="132" height="30" rx="12" fill="#6fe0c1" ' + W + '/>' +
      '<polygon points="60,110 63.5,117.5 71.5,118.5 65.5,124 67.2,132 60,128 52.8,132 54.5,124 48.5,118.5 56.5,117.5" fill="#ffd166" ' + W + '/>' +
      '<line x1="84" y1="119" x2="150" y2="119" stroke="#2b2d42" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>' },
    { name: 'book', article: 'a', svg:
      '<rect x="40" y="18" width="120" height="130" rx="6" fill="#d7263d" ' + W + '/>' +

      el.firstChild.style.animation = 'none';
      document.body.appendChild(el);
      drag = { el: el, w: w, h: h, over: null, id: e.pointerId };
      try { art.setPointerCapture(e.pointerId); } catch (err) { /* fine without capture */ }
      $('picture').classList.add('dragging');
      ghostTo(drag, e.clientX, e.clientY, 1.08, -4);
    });

    art.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      ghostTo(drag, e.clientX, e.clientY, 1.08, -4);
      var z = zoneAt(e.clientX, e.clientY);
      if (z !== drag.over) {
        if (drag.over) drag.over.classList.remove('over');
        if (z && !z.classList.contains('wrong')) { z.classList.add('over'); } else { z = null; }
        drag.over = z;
      }
    });

    function release(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var x = e.clientX, y = e.clientY;
      var zone = e.type === 'pointercancel' ? null : zoneAt(x, y);
      var g = endDrag();
      if (!zone || zone.classList.contains('wrong')) { springBack(g); return; }
      var right = zone.getAttribute('data-right') === '1';
      if (right) {
        var zr = zone.getBoundingClientRect();
        g.el.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1), opacity .3s .1s';
        ghostTo(g, zr.left + 60, zr.top + zr.height / 2, .35, 0);
        g.el.style.opacity = 0;
        setTimeout(function () { g.el.remove(); }, 420);
      } else {
        springBack(g);
      }
      choose(zone, right, solve);
    }
    art.addEventListener('pointerup', release);
    art.addEventListener('pointercancel', release);
  }

  mascotInit();
  setupDrag();

  $('next').addEventListener('click', function () {
    if (!answered) return;
    if (index === ITEMS.length - 1) { transitionTo(finish); } else { transitionTo(function () { index++; render(); }); }
  });
  $('nextActivity').addEventListener('click', function () { if (mode === '1') start('1.2'); });
  $('tab1').addEventListener('click', function () { if (mode !== '1') start('1'); });
  $('tab12').addEventListener('click', function () { if (mode !== '1.2') start('1.2'); });
  $('sound').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) beep(true);   // also a quick sound check
  });

  start('1');
})();
</script>

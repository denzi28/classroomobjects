<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Objects</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #2b2d42;
    --muted: #6b6f85;
    --line: #e4dcc6;
    --accent: #3a86ff;
    --good: #2fbf71;
    --good-bg: #d9f7e6;
    --bad: #e5484d;
    --bad-bg: #fde3e4;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
  }
  h1 { margin: 0; font-size: clamp(22px, 3vw, 38px); }
  .tabs { display: flex; gap: 10px; }
  .tab {
    font: inherit;
    font-size: clamp(16px, 1.8vw, 24px);
    padding: 8px 20px;
    border-radius: 999px;
    border: 3px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .2s var(--ease-spring), background .25s, border-color .25s;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:disabled { opacity: .45; cursor: default; }
  .score { font-size: clamp(18px, 2.2vw, 30px); font-weight: bold; white-space: nowrap; display: inline-block; }
  .score.bump { animation: bump .5s var(--ease-spring); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(-4deg); } 100% { transform: scale(1); } }

  .progress { height: 14px; margin: 0 28px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > div {
    height: 100%;
    width: 100%;
    transform: scaleX(0);
    transform-origin: left;
    background: linear-gradient(90deg, #3a86ff, #59c9a5);
    border-radius: 99px;
    transition: transform .6s var(--ease-out);
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    padding: 20px 28px 28px;
    align-items: stretch;
  }
  .picture {
    background: var(--card);
    border: 4px solid var(--line);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 0;
    transition: border-color .3s, background .3s;
  }
  .picture.solved { border-color: var(--good); background: #f4fdf8; }
  .picture svg {
    width: 100%;
    height: 100%;
    max-height: 62vh;
    animation: float 3.6s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .picture.solved svg { animation: hop .7s var(--ease-spring); }
  @keyframes hop { 0% { transform: scale(1); } 35% { transform: scale(1.12) rotate(-3deg); } 70% { transform: scale(.97) rotate(2deg); } 100% { transform: scale(1); } }

  /* question change: old content leaves, new content arrives */
  .picture, .quiz > * { will-change: transform, opacity; }
  .leaving { animation: leave .22s ease-in forwards; }
  .entering { animation: enter .5s var(--ease-out) both; }
  @keyframes leave { to { opacity: 0; transform: translateX(-30px) scale(.97); } }
  @keyframes enter { from { opacity: 0; transform: translateX(40px) scale(.97); } to { opacity: 1; transform: none; } }

  .quiz { display: flex; flex-direction: column; justify-content: center; gap: 20px; min-height: 0; }
  .question { font-size: clamp(34px, 5.5vw, 80px); font-weight: bold; margin: 0 0 6px; }
  .question .q-emoji { display: inline-block; animation: wiggle 2.8s ease-in-out infinite; transform-origin: 70% 80%; }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(14deg); } 90% { transform: rotate(-10deg); } 95% { transform: rotate(8deg); } }
  .options { display: flex; flex-direction: column; gap: 18px; }
  .option {
    font: inherit;
    font-size: clamp(26px, 4vw, 56px);
    display: flex;
    align-items: center;
    gap: 22px;
    text-align: left;
    padding: 16px 26px;
    border-radius: 24px;
    border: 4px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    position: relative;
    transition: transform .25s var(--ease-spring), background .3s, border-color .3s, opacity .3s, box-shadow .3s;
    animation: pop .5s var(--ease-spring) backwards;
    animation-delay: calc(var(--i) * 90ms + 120ms);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
  @media (hover: hover) { .option:hover { transform: translateX(8px); box-shadow: 0 6px 0 var(--line); } }
  .option:active { transform: scale(.97); }
  .option .letter {
    flex: none;
    width: 1.5em; height: 1.5em;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--line);
    font-weight: bold;
    transition: background .3s, border-color .3s, color .3s;
  }
  .option .label { flex: 1; }
  .option .mark { font-size: .9em; opacity: 0; transform: scale(0) rotate(-40deg); transition: transform .45s var(--ease-spring), opacity .2s; }
  .option.correct { background: var(--good-bg); border-color: var(--good); animation: none; transform: scale(1.03); }
  .option.correct .letter { background: var(--good); border-color: var(--good); color: #fff; }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .4s ease; }
  .option.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.correct .mark, .option.wrong .mark { opacity: 1; transform: none; }
  .options.locked .option:not(.correct):not(.wrong) { opacity: .5; transform: scale(.98); }
  .options.locked .option { cursor: default; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); } 40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); } 80% { transform: translateX(4px); }
  }

  .feedback {
    min-height: 1.3em;
    font-size: clamp(24px, 3.2vw, 44px);
    font-weight: bold;
    margin: 0;
  }
  .feedback.show { animation: pop .5s var(--ease-spring) both; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .next {
    align-self: flex-start;
    font: inherit;
    font-size: clamp(22px, 3vw, 40px);
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transform: translateY(16px) scale(.9);
    pointer-events: none;
    transition: opacity .3s, transform .45s var(--ease-spring);
  }
  .next.show { opacity: 1; transform: none; pointer-events: auto; }
  .next.show:active { transform: scale(.94); }

  .done { grid-column: 1 / -1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .done h2 { font-size: clamp(36px, 6vw, 84px); margin: 0; }
  .done p { font-size: clamp(24px, 3.5vw, 48px); margin: 0; }
  .done .stars { font-size: clamp(56px, 10vw, 150px); font-weight: bold; animation: pop .7s var(--ease-spring) .3s backwards; }
  .done .stars span { display: inline-block; animation: pop .7s var(--ease-spring) both; animation-delay: calc(var(--i) * 180ms + 200ms); }
  .done .next { opacity: 1; transform: none; pointer-events: auto; align-self: center; }
  body.finished main > :not(.done) { display: none; }
  body.finished .done { display: flex; animation: enter .6s var(--ease-out) both; }

  .flystar {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 11;
    font-size: clamp(40px, 5vw, 76px);
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }

  .confetti {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 10;
    font-size: clamp(24px, 3vw, 44px);
    will-change: transform, opacity;
  }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; overflow: auto; }
    .picture svg { max-height: 34vh; }
  }
</style>
</head>
<body>
<header>
  <h1>🏫 Classroom Objects</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true">🔍 Activity 1 · What is it?</button>
    <button class="tab" role="tab" aria-selected="false" disabled title="Coming soon">🤔 Activity 2 · Is it …?</button>
  </div>
  <button class="tab" id="sound" title="Sound on/off" aria-label="Sound">🔊</button>
  <div class="score" id="score">⭐ 0 / 8</div>
</header>
<div class="progress"><div id="bar"></div></div>

<main>
  <div class="picture" id="picture" aria-live="polite"></div>
  <section class="quiz">
    <p class="question" id="question">What is it? <span class="q-emoji">🤔</span></p>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="next" id="next">Next ➜</button>
  </section>
  <section class="done">
    <h2>Well done!</h2>
    <div class="stars" id="stars"></div>
    <button class="next" id="nextActivity">Next activity ➜</button>
  </section>
</main>

<script>
(function () {
  // Simple hand-drawn pictures, so the page works offline on the smartboard.
  var W = 'stroke="#2b2d42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';

  // One pencil sticking out of the pencil case, drawn pointing up.
  function casePencil(x, angle, body, tip) {
    return '<g transform="rotate(' + angle + ' ' + x + ' 80)">' +
      '<rect x="' + (x - 7) + '" y="14" width="14" height="66" fill="' + body + '" ' + W + '/>' +
      '<polygon points="' + (x - 7) + ',14 ' + (x + 7) + ',14 ' + x + ',0" fill="#f6d8a8" ' + W + '/>' +
      '<polygon points="' + (x - 2.6) + ',5 ' + (x + 2.6) + ',5 ' + x + ',0" fill="#2b2d42"/>' +
      '</g>';
  }

  var ITEMS = [
    { name: 'desk', article: 'a', svg:
      '<rect x="22" y="58" width="156" height="16" rx="3" fill="#c98a4b" ' + W + '/>' +
      '<rect x="34" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="158" y="74" width="8" height="70" fill="#a9703a" ' + W + '/>' +
      '<rect x="42" y="96" width="116" height="10" fill="#a9703a" ' + W + '/>' },
    { name: 'chair', article: 'a', svg:
      '<rect x="62" y="16" width="76" height="62" rx="6" fill="#d9a066" ' + W + '/>' +
      '<line x1="82" y1="22" x2="82" y2="74" ' + W + '/><line x1="100" y1="22" x2="100" y2="74" ' + W + '/><line x1="118" y1="22" x2="118" y2="74" ' + W + '/>' +
      '<rect x="48" y="84" width="104" height="16" rx="4" fill="#c98a4b" ' + W + '/>' +
      '<line x1="58" y1="100" x2="52" y2="148" ' + W + '/><line x1="142" y1="100" x2="148" y2="148" ' + W + '/>' +
      '<line x1="72" y1="100" x2="76" y2="140" ' + W + '/><line x1="128" y1="100" x2="124" y2="140" ' + W + '/>' },
    { name: 'pencil', article: 'a', svg:
      '<g transform="rotate(-35 100 80)">' +
      '<rect x="24" y="66" width="22" height="28" rx="4" fill="#f4a6b8" ' + W + '/>' +
      '<rect x="44" y="66" width="8" height="28" fill="#b9bcc7" ' + W + '/>' +
      '<rect x="50" y="66" width="98" height="28" fill="#ffb627" ' + W + '/>' +
      '<polygon points="148,66 182,80 148,94" fill="#f6d8a8" ' + W + '/>' +
      '<polygon points="170,75 182,80 170,85" fill="#2b2d42" ' + W + '/>' +
      '</g>' },
    { name: 'pencil case', article: 'a', svg:
      // pencils peek out from behind the case
      casePencil(58, -10, '#e5484d') +
      casePencil(86, -2, '#3a86ff') +
      casePencil(114, 5, '#59c9a5') +
      casePencil(142, 13, '#ffb627') +
      // case body
      '<rect x="18" y="72" width="164" height="72" rx="24" fill="#3ac2a0" ' + W + '/>' +
      // zipper strip along the top, with teeth and a pull tab
      '<rect x="30" y="82" width="140" height="12" rx="6" fill="#2a9d82" ' + W + '/>' +
      '<line x1="36" y1="88" x2="156" y2="88" stroke="#f4f1de" stroke-width="7" stroke-dasharray="3 5" stroke-linecap="butt"/>' +
      '<rect x="150" y="80" width="18" height="16" rx="5" fill="#ffd166" ' + W + '/>' +
      '<circle cx="168" cy="88" r="6" fill="none" ' + W + '/>' +
      // front pocket with a star
      '<rect x="34" y="104" width="132" height="30" rx="12" fill="#6fe0c1" ' + W + '/>' +
      '<polygon points="60,110 63.5,117.5 71.5,118.5 65.5,124 67.2,132 60,128 52.8,132 54.5,124 48.5,118.5 56.5,117.5" fill="#ffd166" ' + W + '/>' +
      '<line x1="84" y1="119" x2="150" y2="119" stroke="#2b2d42" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>' },
    { name: 'book', article: 'a', svg:
      '<rect x="40" y="18" width="120" height="130" rx="6" fill="#d7263d" ' + W + '/>' +
      '<rect x="40" y="18" width="14" height="130" fill="#a31a2c" ' + W + '/>' +
      '<rect x="68" y="44" width="78" height="34" rx="4" fill="#fff" ' + W + '/>' +
      '<text x="107" y="68" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="bold" fill="#2b2d42">Maths</text>' },
    { name: 'blackboard', article: 'a', svg:
      '<rect x="14" y="22" width="172" height="104" rx="6" fill="#c98a4b" ' + W + '/>' +
      '<rect x="26" y="34" width="148" height="80" fill="#2f3b3a" ' + W + '/>' +
      '<path d="M44 60 q12-14 24 0 t24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>' +
      '<line x1="44" y1="84" x2="120" y2="84" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>' +
      '<rect x="14" y="126" width="172" height="10" rx="3" fill="#a9703a" ' + W + '/>' +
      '<rect x="130" y="119" width="22" height="7" rx="3" fill="#fff" ' + W + '/>' },
    { name: 'bookcase', article: 'a', svg:
      '<rect x="32" y="12" width="136" height="138" rx="4" fill="#c98a4b" ' + W + '/>' +
      '<rect x="42" y="22" width="116" height="118" fill="#8a5a2b" ' + W + '/>' +
      '<line x1="42" y1="62" x2="158" y2="62" ' + W + '/><line x1="42" y1="101" x2="158" y2="101" ' + W + '/>' +
      '<rect x="50" y="32" width="14" height="30" fill="#3a86ff"/><rect x="66" y="38" width="12" height="24" fill="#ffb627"/><rect x="80" y="30" width="16" height="32" fill="#59c9a5"/><rect x="112" y="36" width="14" height="26" fill="#d7263d"/>' +
      '<rect x="52" y="71" width="16" height="30" fill="#d7263d"/><rect x="70" y="77" width="12" height="24" fill="#3a86ff"/><rect x="100" y="70" width="14" height="31" fill="#ffb627"/><rect x="116" y="76" width="16" height="25" fill="#59c9a5"/>' +
      '<rect x="50" y="112" width="20" height="28" fill="#59c9a5"/><rect x="72" y="108" width="14" height="32" fill="#ffb627"/><rect x="120" y="114" width="14" height="26" fill="#3a86ff"/>' },
    { name: 'eraser', article: 'an', svg:
      '<g transform="rotate(-25 100 80)">' +
      '<rect x="36" y="52" width="128" height="56" rx="8" fill="#f4f1de" ' + W + '/>' +
      '<rect x="64" y="52" width="72" height="56" fill="#3a86ff" ' + W + '/>' +
      '<rect x="36" y="52" width="128" height="56" rx="8" fill="none" ' + W + '/>' +
      '</g>' }
  ];

  var PRAISE = ['Great job!', 'Excellent!', 'Perfect!', 'Well done!', 'Super!', 'Awesome!', 'Fantastic!'];
  var PRAISE_EMOJI = ['🎉', '👏', '🌟', '🥳', '💪', '🚀', '🏆'];
  var CONFETTI = ['🎉', '✨', '🎊', '💫'];

  var $ = function (id) { return document.getElementById(id); };
  var LETTERS = ['A', 'B', 'C'];
  var order, index, score, answered, triedWrong, busy;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // Recorded sounds (already at half volume). Each play restarts from the beginning.
  var SOUNDS = { good: new Audio('sounds/correct.mp3'), bad: new Audio('sounds/wrong.mp3'), end: new Audio('sounds/applause.mp3') };
  Object.keys(SOUNDS).forEach(function (k) { SOUNDS[k].preload = 'auto'; });
  var soundOn = true;
  function beep(kind) {   // true = correct, false = wrong, 'end' = applause
    if (!soundOn) return;
    var snd = SOUNDS[kind === 'end' ? 'end' : kind ? 'good' : 'bad'];
    try {
      snd.pause();
      snd.currentTime = 0;
      var p = snd.play();
      if (p && p.catch) p.catch(function () { /* blocked until the first tap; sound is optional */ });
    } catch (e) { /* sound is optional */ }
  }

  // Emoji confetti flying out of a point, animated with the Web Animations API.
  function burst(x, y, count, emojis) {
    if (!document.body.animate) return;
    for (var i = 0; i < count; i++) {
      var el = document.createElement('span');
      el.className = 'confetti';
      el.textContent = pick(emojis || CONFETTI);
      document.body.appendChild(el);
      var angle = Math.random() * Math.PI * 2;
      var dist = 140 + Math.random() * 260;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 120;
      var spin = (Math.random() - .5) * 720;
      var a = el.animate([
        { transform: 'translate(' + x + 'px,' + y + 'px) scale(.3) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + (x + dx * .6) + 'px,' + (y + dy * .6) + 'px) scale(1.2) rotate(' + spin * .6 + 'deg)', opacity: 1, offset: .55 },
        { transform: 'translate(' + (x + dx) + 'px,' + (y + dy + 220) + 'px) scale(.8) rotate(' + spin + 'deg)', opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      a.onfinish = (function (n) { return function () { n.remove(); }; })(el);
    }
  }

  function setScore(bumped) {
    var s = $('score');
    s.textContent = '⭐ ' + score + ' / ' + ITEMS.length;
    if (bumped) {
      s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
    }
  }

  // A star flies from the right answer up to the score in the top-right corner.
  // Plain requestAnimationFrame, so it works in every browser and ignores "reduce motion" settings.
  function flyStar(fromEl, onLand) {
    var target = $('score');
    var a = fromEl.getBoundingClientRect(), t = target.getBoundingClientRect();
    var sx = a.left + a.width / 2, sy = a.top + a.height / 2;
    var tx = t.left + 22, ty = t.top + t.height / 2;          // the ⭐ at the start of the score
    var cx = sx + (tx - sx) * .35, cy = Math.max(30, Math.min(sy, ty) - 120);   // curve control point, kept on screen
    var el = document.createElement('span');
    el.className = 'flystar';
    el.textContent = '⭐';
    document.body.appendChild(el);
    var DUR = 1100, t0 = null, landed = false;
    function land() { if (landed) return; landed = true; el.remove(); onLand(); }
    function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }   // easeInOutCubic
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / DUR), e = ease(k), u = 1 - e;
      var x = u * u * sx + 2 * u * e * cx + e * e * tx;
      var y = u * u * sy + 2 * u * e * cy + e * e * ty;
      var scale = k < .2 ? .3 + 1.2 * (k / .2) : 1.5 - .95 * ((k - .2) / .8);   // pop up, then shrink toward the score
      el.style.opacity = k < .1 ? k / .1 : 1;
      el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(' + scale + ') rotate(' + (e * 360) + 'deg)';
      if (k < 1) requestAnimationFrame(frame); else land();
    }
    el.style.opacity = 0;
    requestAnimationFrame(frame);
    setTimeout(land, DUR + 600);     // safety net if the tab was in the background and frames were paused
  }

  function start() {
    order = shuffle(ITEMS);
    index = 0; score = 0; busy = false;
    document.body.classList.remove('finished');
    setScore(false);
    render(true);
  }

  function render(first) {
    var item = order[index];
    answered = false; triedWrong = false;
    var pic = $('picture');
    pic.classList.remove('solved', 'leaving');
    pic.innerHTML = '<svg viewBox="0 -8 200 168" role="img" aria-label="classroom object">' + item.svg + '</svg>';
    $('bar').style.transform = 'scaleX(' + (index / ITEMS.length) + ')';
    $('next').classList.remove('show');
    $('feedback').className = 'feedback';
    $('feedback').textContent = '';

    var wrongOnes = shuffle(ITEMS.filter(function (x) { return x !== item; })).slice(0, 2);
    var choices = shuffle([item].concat(wrongOnes));
    var box = $('options');
    box.className = 'options';
    box.innerHTML = '';
    choices.forEach(function (c, i) {
      var b = document.createElement('button');
      b.className = 'option';
      b.style.setProperty('--i', i);
      b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span class="label">' + c.article + ' ' + c.name + '</span><span class="mark"></span>';
      b.addEventListener('click', function () { choose(b, c === item); });
      box.appendChild(b);
    });

    // slide the new question in
    [pic, $('question')].forEach(function (el) {
      el.classList.remove('entering'); void el.offsetWidth; el.classList.add('entering');
    });
  }

  function transitionTo(fn) {
    if (busy) return;
    busy = true;
    var leaving = [$('picture'), $('question'), $('options'), $('feedback'), $('next')];
    leaving.forEach(function (el) { el.classList.remove('entering'); el.classList.add('leaving'); });
    setTimeout(function () {
      leaving.forEach(function (el) { el.classList.remove('leaving'); });
      fn();
      busy = false;
    }, 230);
  }

  function choose(btn, isRight) {
    if (answered || busy || btn.classList.contains('wrong')) return;
    var fb = $('feedback');
    var mark = btn.querySelector('.mark');
    if (isRight) {
      answered = true;
      btn.classList.add('correct');
      mark.textContent = '✅';
      $('options').classList.add('locked');
      $('picture').classList.add('solved');
      if (!triedWrong) {            // a star only for answers that were right on the first try
        score++;
        flyStar(btn, function () { setScore(true); });
      }
      var n = Math.floor(Math.random() * PRAISE.length);
      fb.className = 'feedback good show';
      fb.textContent = PRAISE_EMOJI[n] + ' ' + PRAISE[n];
      $('next').textContent = index === ITEMS.length - 1 ? 'Finish 🏁' : 'Next ➜';
      $('next').classList.add('show');
      var r = btn.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, triedWrong ? 6 : 10);
      beep(true);
    } else {
      triedWrong = true;
      btn.classList.add('wrong');
      mark.textContent = '❌';
      fb.className = 'feedback bad show';
      fb.textContent = '🙂 Try again!';
      fb.style.animation = 'none'; void fb.offsetWidth; fb.style.animation = '';
      beep(false);
    }
  }

  function finish() {
    $('bar').style.transform = 'scaleX(1)';
    setScore(false);
    $('stars').textContent = '⭐ ' + score + ' / ' + ITEMS.length;
    document.body.classList.add('finished');
    setTimeout(function () {
      var W = window.innerWidth, H = window.innerHeight, F = ['🥳'];
      burst(W * .2, H * .65, 14, F);
      burst(W * .8, H * .65, 14, F);
      burst(W * .5, H * .8, 14, F);
      beep('end');
    }, 250);
  }

  $('next').addEventListener('click', function () {
    if (!answered) return;
    if (index === ITEMS.length - 1) { transitionTo(finish); } else { transitionTo(function () { index++; render(); }); }
  });
  // "Next activity" has no action yet.
  $('sound').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) beep(true);   // also a quick sound check
  });

  start();
})();
</script>
</body>
</html>
